<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Website</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --fg: #f2f2f2; --muted: #9aa0a6; --accent: #60a5fa; }
  }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { font-size: 2.2rem; margin-bottom: .25rem; }
  p.tag { color: var(--muted); margin-top: 0; }
  a { color: var(--accent); }
  nav a { margin-right: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Hello, I'm Admin.</h1>
  <p class="tag">Welcome to my corner of the internet.</p>
  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <h2 id="about">About</h2>
  <p>Write a few sentences about yourself here.</p>

  <h2 id="projects">Projects</h2>
  <ul>
    <li><a href="mail-dashboard/">Mail dashboard</a> (optional: add later)</li>
  </ul>

  <h2 id="contact">Contact</h2>
  <p>you@example.com</p>
</main>
</body>
</html>
